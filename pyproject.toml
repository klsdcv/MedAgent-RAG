[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vertex-med-rag"
version = "0.1.0"
description = "MedAgent-RAG, rewritten on Google ADK + Vertex AI (Search, Vector Search, Gemini, Agent Engine)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kyusung choi" }]

dependencies = [
    # ── Google ADK + Vertex AI ──
    "google-adk>=0.5.0",
    "google-cloud-aiplatform[agent_engines]>=1.71.0",
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-storage>=2.18.0",

    # ── 설정/검증 ──
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # ── HTTP / 외부 API ──
    "httpx>=0.27.0",
    "requests>=2.32.0",

    # ── UI ──
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
ingest = [
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "agents", "tools", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
